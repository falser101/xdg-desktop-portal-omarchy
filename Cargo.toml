[package]
name = "xdg-desktop-portal-omarchy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "XDG Desktop Portal backend for Omarchy"
repository = "https://github.com/falser101/xdg-desktop-portal-omarchy"
rust-version = "1.80"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
eframe = { version = "0.32", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.32"
futures = "0.3"
glob = "0.3"
libc = "0.2"
mime_guess = "2"
notify = "8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "x11"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"

[profile.release]
lto = true
codegen-units = 1
